version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://alt:altpassword@db:5432/alt
      - AUTH_SECRET_KEY=change-me-to-a-long-random-string
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=alt
      - POSTGRES_PASSWORD=altpassword
      - POSTGRES_DB=alt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
