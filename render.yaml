# Render Blueprint: one web service (API + dashboard on the same origin) and
# one managed PostgreSQL database. In Render: New -> Blueprint -> pick this repo.
services:
  - type: web
    name: alt-digital-student-twin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: alt-db
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false   # paste it in the Render dashboard; never commit it

databases:
  - name: alt-db
    plan: free
    databaseName: alt
    user: alt
